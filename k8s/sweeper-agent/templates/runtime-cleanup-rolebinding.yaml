{{- if .Values.runtimeCleanup.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "sweeper-agent.fullname" . }}-runtime-cleanup
  labels:
    {{- include "sweeper-agent.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "sweeper-agent.fullname" . }}-runtime-cleanup
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "sweeper-agent.fullname" . }}-runtime-cleanup
{{- end }}
