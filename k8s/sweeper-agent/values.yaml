replicaCount: 1

image:
  repository: us-central1-docker.pkg.dev/adlt-s26/adlt-s26-repo/sweeper-agent
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: sweeper-agent
  gcpServiceAccount: ""

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    memory: 512Mi
    cpu: "0.5"
  requests:
    memory: 256Mi
    cpu: "0.1"

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 30

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 15
  periodSeconds: 15

# Env vars injected via ConfigMap (set per-environment in skaffold profiles)
env: {}

# Cloud Deploy applies rendered manifests without pruning objects omitted by a
# later release. Staging enables this bounded cleanup job for the one-time
# browser-runtime removal. It deletes only the old workloads, services, and
# service account; chrome-vnc-pvc is deliberately preserved and unmounted.
runtimeCleanup:
  enabled: false
  timeoutSeconds: 120
