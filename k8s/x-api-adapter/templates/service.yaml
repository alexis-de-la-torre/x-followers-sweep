apiVersion: v1
kind: Service
metadata:
  name: {{ include "x-api-adapter.fullname" . }}
  labels:
    {{- include "x-api-adapter.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.actuatorPort }}
      targetPort: actuator
      protocol: TCP
      name: actuator
  selector:
    {{- include "x-api-adapter.selectorLabels" . | nindent 4 }}
