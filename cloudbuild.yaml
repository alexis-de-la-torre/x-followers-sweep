# Deployable-unit build for x-followers-sweep
# On push to main → GKE via Cloud Deploy.
#
# One-time setup:
#   gcloud deploy apply --file=clouddeploy.yaml --region=us-central1 --project=adlt-s26
#   gcloud builds triggers create github \
#     --name="x-followers-sweep-deploy" \
#     --repo-owner="alexis-de-la-torre" \
#     --repo-name="x-followers-sweep" \
#     --branch-pattern="^main$" \
#     --build-config="cloudbuild.yaml" \
#     --region=us-central1 --project=adlt-s26 \
#     --service-account="projects/adlt-s26/serviceAccounts/24315173277-compute@developer.gserviceaccount.com"
steps:
  # The buildpack skips tests while creating the native binary, so gate the
  # release with the JVM contract suite first.
  - name: 'maven:3.9-eclipse-temurin-25'
    entrypoint: 'mvn'
    args:
      - '-f'
      - 'services/x-api-adapter/pom.xml'
      - 'test'
    id: 'test-x-api-adapter'

  # Build the sweeper-agent image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/sweeper-agent:$SHORT_SHA'
      - '-f'
      - 'services/sweeper-agent/Dockerfile'
      - '.'
    id: 'build-sweeper-agent'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/sweeper-agent:$SHORT_SHA'
    id: 'push-sweeper-agent'

  # Build the x-sweeper-web frontend (Next.js standalone)
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/x-sweeper-web:$SHORT_SHA'
      - '-f'
      - 'services/x-sweeper-web/Dockerfile'
      - 'services/x-sweeper-web'
    id: 'build-x-sweeper-web'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/x-sweeper-web:$SHORT_SHA'
    id: 'push-x-sweeper-web'

  # Build the Java 25 adapter as a GraalVM native image. It is scoped so the
  # existing Docker builds remain unchanged and Cloud Deploy receives one tag.
  - name: 'gcr.io/k8s-skaffold/skaffold:v2.21.0'
    id: 'build-x-api-adapter'
    entrypoint: '/bin/bash'
    env:
      - 'SHORT_SHA=$SHORT_SHA'
    args:
      - '-c'
      - |
        skaffold build -f skaffold-x-api-adapter.yaml --push=true

  # Create release in Cloud Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'gcloud'
    args:
      - 'deploy'
      - 'releases'
      - 'create'
      - 'xfs-$SHORT_SHA'
      - '--delivery-pipeline=adlt-s26-x-followers-sweep-pipeline'
      - '--region=us-central1'
      - '--skaffold-file=skaffold.yaml'
      - '--images=us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/sweeper-agent=us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/sweeper-agent:$SHORT_SHA,us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/x-sweeper-web=us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/x-sweeper-web:$SHORT_SHA,us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/x-api-adapter=us-central1-docker.pkg.dev/$PROJECT_ID/adlt-s26-repo/x-api-adapter:$SHORT_SHA'
    id: 'create-release'

options:
  logging: CLOUD_LOGGING_ONLY
  # Native-image compilation expands Spring/Jackson reachability metadata and
  # needs the same high-memory builder class used by Sofom's ventanilla.
  machineType: E2_HIGHCPU_32
