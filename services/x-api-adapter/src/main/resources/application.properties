spring.application.name=x-api-adapter
server.port=${SERVER_PORT:8030}
management.server.port=${MANAGEMENT_PORT:8031}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

x.api.base-url=${X_API_BASE_URL:https://api.x.com}
x.api.consumer-key=${X_API_CONSUMER_KEY:}
x.api.consumer-secret=${X_API_CONSUMER_SECRET:}
x.api.access-token=${X_API_ACCESS_TOKEN:}
x.api.access-token-secret=${X_API_ACCESS_TOKEN_SECRET:}
x.api.connect-timeout=${X_API_CONNECT_TIMEOUT:PT3S}
x.api.read-timeout=${X_API_READ_TIMEOUT:PT15S}

logging.level.dev.adlt.xapi=INFO
