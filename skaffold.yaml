apiVersion: skaffold/v4beta6
kind: Config
metadata:
  name: x-followers-sweep
build:
  artifacts:
    - image: us-central1-docker.pkg.dev/adlt-s26/adlt-s26-repo/sweeper-agent
      context: .
      docker:
        dockerfile: services/sweeper-agent/Dockerfile
    # X Sweeper web frontend — Next.js standalone server (see services/x-sweeper-web/README.md).
    - image: us-central1-docker.pkg.dev/adlt-s26/adlt-s26-repo/x-sweeper-web
      context: services/x-sweeper-web
      docker:
        dockerfile: Dockerfile
    - image: us-central1-docker.pkg.dev/adlt-s26/adlt-s26-repo/x-api-adapter
      context: services/x-api-adapter
      buildpacks:
        builder: paketobuildpacks/builder-jammy-tiny
        trustBuilder: true
        env:
          - BP_NATIVE_IMAGE=true
          - BP_JVM_VERSION=25
          - BP_MAVEN_BUILD_ARGUMENTS=-Dmaven.test.skip=true -Pnative package
deploy:
  helm:
    releases:
      - name: sweeper-agent
        chartPath: k8s/sweeper-agent
        valuesFiles:
          - k8s/sweeper-agent/values.yaml
        setValues:
          image.tag: "{{.IMAGE_TAG_sweeper_agent}}"
      - name: x-sweeper-web
        chartPath: k8s/x-sweeper-web
        valuesFiles:
          - k8s/x-sweeper-web/values.yaml
        setValueTemplates:
          image.tag: "{{.IMAGE_TAG_x_sweeper_web}}"
      - name: x-api-adapter
        chartPath: k8s/x-api-adapter
        valuesFiles:
          - k8s/x-api-adapter/values.yaml
        setValueTemplates:
          image.tag: "{{.IMAGE_TAG_x_api_adapter}}"
profiles:
  - name: adlt-staging
    deploy:
      helm:
        releases:
          - name: sweeper-agent
            chartPath: k8s/sweeper-agent
            valuesFiles:
              - k8s/sweeper-agent/values.yaml
            namespace: adlt-staging
            setValueTemplates:
              serviceAccount.gcpServiceAccount: "sweeper-agent@adlt-s26.iam.gserviceaccount.com"
              env.SWEEPER_PLATFORM_ENABLED: "true"
              env.GOOGLE_CLOUD_PROJECT: "adlt-s26"
              env.PUBSUB_PREFIX: ""
              env.SWEEPER_SUBSCRIPTION: "OUTCOME.DELIVERY.FULLFILLER.NOTIFICATIONS.NEW-TASK-TO-BE-DONE.sweeper-agent"
              env.OUTCOME_ENGINE_URL: "http://outcome-engine:8080"
              env.X_API_ADAPTER_URL: "http://x-api-adapter:8080"
              env.OPENROUTER_API_KEY: "sk-or-..."
              runtimeCleanup.enabled: true
          - name: x-sweeper-web
            chartPath: k8s/x-sweeper-web
            valuesFiles:
              - k8s/x-sweeper-web/values.yaml
            namespace: adlt-staging
          - name: x-api-adapter
            chartPath: k8s/x-api-adapter
            valuesFiles:
              - k8s/x-api-adapter/values.yaml
            namespace: adlt-staging
  - name: adlt-prod
    deploy:
      helm:
        releases:
          - name: sweeper-agent
            chartPath: k8s/sweeper-agent
            valuesFiles:
              - k8s/sweeper-agent/values.yaml
            namespace: adlt-prod
            setValueTemplates:
              serviceAccount.gcpServiceAccount: "sweeper-agent@adlt-s26.iam.gserviceaccount.com"
              env.OPENROUTER_API_KEY: "sk-or-..."
